<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Delay Cost Engine — Wiser With Vidhaan</title>
  <meta name="description" content="Find out exactly what starting late has cost you — in rupees, not lectures." />
  <meta name="theme-color" content="#09090F" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body,#root{min-height:100%;background:#09090F;}
    .app{min-height:100vh;background:#09090F;color:#EDE9E3;font-family:'DM Sans',sans-serif;}
    .glow-bg{position:fixed;inset:0;background:radial-gradient(ellipse 55% 40% at 20% 10%,rgba(245,200,66,0.05) 0%,transparent 60%),radial-gradient(ellipse 45% 35% at 85% 85%,rgba(0,217,160,0.05) 0%,transparent 60%);pointer-events:none;z-index:0;}
    .wrap{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:56px 24px 96px;}
    .eyebrow{font-size:11px;font-weight:600;letter-spacing:3.5px;text-transform:uppercase;color:#F5C842;margin-bottom:16px;}
    .hero-title{font-family:'DM Serif Display',serif;font-size:clamp(44px,7vw,76px);line-height:1.0;color:#EDE9E3;margin-bottom:18px;letter-spacing:-1px;}
    .hero-title em{font-style:italic;color:#F5C842;}
    .hero-sub{font-size:16px;color:#5A5A70;line-height:1.75;max-width:480px;margin-bottom:60px;font-weight:300;}
    .card{background:#0F0F1A;border:1px solid #1C1C2A;border-radius:20px;padding:32px;margin-bottom:20px;}
    .card-label{font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#303044;margin-bottom:28px;}
    .sg{margin-bottom:32px;}
    .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
    .sn{font-size:13px;color:#606078;font-weight:400;}
    .sv{font-family:'DM Serif Display',serif;font-size:26px;color:#EDE9E3;line-height:1;}
    .sv small{font-size:13px;color:#404058;font-family:'DM Sans',sans-serif;margin-left:4px;font-weight:400;}
    input[type=range]{-webkit-appearance:none;width:100%;height:2px;border-radius:2px;outline:none;cursor:pointer;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;cursor:pointer;transition:transform .15s,box-shadow .15s;}
    input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);}
    .rng-gold::-webkit-slider-thumb{background:#F5C842;box-shadow:0 0 0 5px rgba(245,200,66,0.14);}
    .rng-teal::-webkit-slider-thumb{background:#00D9A0;box-shadow:0 0 0 5px rgba(0,217,160,0.14);}
    .cta-btn{width:100%;padding:19px;background:#F5C842;color:#09090F;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;border:none;border-radius:12px;cursor:pointer;text-transform:uppercase;transition:background .15s,transform .15s,box-shadow .2s;margin-top:4px;}
    .cta-btn:hover{background:#FFD84A;transform:translateY(-2px);box-shadow:0 16px 48px rgba(245,200,66,0.22);}
    .cta-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}
    .err-msg{background:rgba(255,71,87,0.07);border:1px solid rgba(255,71,87,0.2);border-radius:8px;padding:10px 14px;font-size:13px;color:#FF4757;margin-bottom:16px;}
    .results{animation:fadeUp .55s ease forwards;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
    .badge-row{display:flex;justify-content:center;margin-bottom:28px;}
    .badge{display:inline-flex;align-items:center;gap:8px;background:rgba(245,200,66,0.08);border:1px solid rgba(245,200,66,0.22);border-radius:100px;padding:8px 20px;font-size:12px;color:#F5C842;font-weight:500;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
    @media(max-width:520px){.grid2{grid-template-columns:1fr;}}
    .rcard{border-radius:16px;padding:26px;}
    .rcard.gold{background:rgba(245,200,66,0.04);border:1px solid rgba(245,200,66,0.18);}
    .rcard.teal{background:rgba(0,217,160,0.04);border:1px solid rgba(0,217,160,0.18);}
    .rtag{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;}
    .rtag.gold{color:#F5C842;}.rtag.teal{color:#00D9A0;}
    .ramt{font-family:'DM Serif Display',serif;font-size:clamp(28px,4.5vw,36px);color:#EDE9E3;line-height:1;margin-bottom:7px;}
    .rdsc{font-size:12px;color:#3A3A50;}
    .cost-card{background:#0B080C;border:1px solid rgba(255,71,87,0.22);border-radius:20px;padding:48px 32px;text-align:center;margin-bottom:20px;position:relative;overflow:hidden;}
    .cost-card-glow{position:absolute;top:-90px;left:50%;transform:translateX(-50%);width:350px;height:180px;background:radial-gradient(ellipse,rgba(255,71,87,0.1),transparent 70%);pointer-events:none;}
    .clabel{font-size:10px;font-weight:700;letter-spacing:3.5px;text-transform:uppercase;color:#FF4757;margin-bottom:20px;position:relative;}
    .camt{font-family:'DM Serif Display',serif;font-size:clamp(52px,10vw,96px);color:#FF4757;line-height:1;margin-bottom:14px;letter-spacing:-2px;position:relative;}
    .csub{font-size:13px;color:#50303A;margin-bottom:28px;position:relative;}
    .cverdict{background:rgba(255,71,87,0.06);border:1px solid rgba(255,71,87,0.1);border-radius:12px;padding:18px 22px;font-size:14px;color:#8A5060;line-height:1.7;font-style:italic;position:relative;}
    .chart-card{background:#0F0F1A;border:1px solid #1C1C2A;border-radius:20px;padding:32px;margin-bottom:20px;}
    .ctitle{font-family:'DM Serif Display',serif;font-size:21px;color:#EDE9E3;margin-bottom:7px;}
    .cdesc{font-size:13px;color:#363650;margin-bottom:22px;}
    .legend{display:flex;gap:22px;margin-bottom:22px;flex-wrap:wrap;}
    .li{display:flex;align-items:center;gap:8px;font-size:12px;color:#5A5A70;}
    .ld{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .cta-end{background:#0C0C16;border:1px solid rgba(245,200,66,0.14);border-radius:20px;padding:38px;text-align:center;}
    .cta-title{font-family:'DM Serif Display',serif;font-size:clamp(20px,3vw,27px);color:#EDE9E3;margin-bottom:10px;line-height:1.35;}
    .cta-sub{font-size:14px;color:#404058;margin-bottom:26px;line-height:1.8;}
    .div-line{height:1px;background:#1C1C2A;margin:24px 0;}
    .tool-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
    .tool-link{display:inline-flex;align-items:center;gap:6px;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;text-decoration:none;transition:transform .12s,opacity .12s;}
    .tool-link:hover{transform:translateY(-1px);opacity:.88;}
    .tool-link.gold{background:#F5C842;color:#09090F;}
    .tool-link.ghost{background:transparent;border:1px solid #1C1C2A;color:#5A5A70;}
    .footer-line{margin-top:56px;text-align:center;font-size:10px;color:#222230;letter-spacing:2.5px;}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const fmt = (n) => {
      if (isNaN(n) || n < 0) return "₹0";
      if (n >= 1e7) return `₹${(n/1e7).toFixed(2)} Cr`;
      if (n >= 1e5) return `₹${(n/1e5).toFixed(1)} L`;
      return `₹${Math.round(n).toLocaleString("en-IN")}`;
    };
    const fmtY = (n) => {
      if (n >= 1e7) return `${(n/1e7).toFixed(0)}Cr`;
      if (n >= 1e5) return `${(n/1e5).toFixed(0)}L`;
      if (n >= 1e3) return `${(n/1e3).toFixed(0)}K`;
      return `${n}`;
    };
    const fmtMonthly = (v) => v >= 1e5 ? "₹1L" : `₹${v.toLocaleString("en-IN")}`;
    const trackBg = (val, min, max, col) => {
      const pct = Math.round(((val-min)/(max-min))*100);
      return { background: `linear-gradient(to right,${col} ${pct}%,#1C1C2A ${pct}%)` };
    };
    const verdict = (yLost, cost) => {
      const cr = cost / 1e7;
      if (yLost <= 0) return "The clock hasn't started yet. Start today and you lose nothing.";
      if (cr < 0.3) return `${yLost} year${yLost>1?"s":""} behind. The gap is real — don't let it grow.`;
      if (cr < 1) return `${yLost} years of compounding quietly missed. This is the number most people never calculate.`;
      if (cr < 3) return `${yLost} years and ${fmt(cost)} — the exact price of waiting. The market didn't pause for you.`;
      return `${yLost} years. ${fmt(cost)} left on the table. The math is indifferent to intention.`;
    };

    function SVGTwoLines({ data, startAge, curAge }) {
      const W = 600, H = 260;
      const pad = { t: 10, r: 10, b: 28, l: 48 };
      const chartW = W - pad.l - pad.r, chartH = H - pad.t - pad.b;
      const n = data.length;
      const maxVal = Math.max(...data.map(d => Math.max(d.early, d.now))) || 1;
      const xS = (i) => pad.l + (i / Math.max(n-1,1)) * chartW;
      const yS = (v) => pad.t + chartH - (v / maxVal) * chartH;

      const ePts = data.map((d,i) => [xS(i).toFixed(1), yS(d.early).toFixed(1)]);
      const nPts = data.map((d,i) => [xS(i).toFixed(1), yS(d.now).toFixed(1)]);
      const bY = yS(0).toFixed(1);
      const bL = xS(0).toFixed(1), bR = xS(n-1).toFixed(1);

      const eArea = `M ${ePts.map(p=>p.join(",")).join(" L ")} L ${bR},${bY} L ${bL},${bY} Z`;
      const nArea = `M ${nPts.map(p=>p.join(",")).join(" L ")} L ${bR},${bY} L ${bL},${bY} Z`;
      const eLine = `M ${ePts.map(p=>p.join(",")).join(" L ")}`;
      const nLine = `M ${nPts.map(p=>p.join(",")).join(" L ")}`;

      const yTicks = [0,0.25,0.5,0.75,1].map(t => ({ v:t*maxVal, y:yS(t*maxVal), label:fmtY(Math.round(t*maxVal)) }));
      const step = Math.max(1, Math.ceil(n/6));
      const xTicks = data.reduce((a,d,i) => { if(i===0||i===n-1||i%step===0) a.push({x:xS(i),label:d.age}); return a; }, []);

      return (
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:"block"}}>
          <defs>
            <linearGradient id="gG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#F5C842" stopOpacity="0.28"/>
              <stop offset="100%" stopColor="#F5C842" stopOpacity="0.02"/>
            </linearGradient>
            <linearGradient id="tG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#00D9A0" stopOpacity="0.28"/>
              <stop offset="100%" stopColor="#00D9A0" stopOpacity="0.02"/>
            </linearGradient>
          </defs>
          {yTicks.map((t,i) => <line key={i} x1={pad.l} x2={W-pad.r} y1={t.y} y2={t.y} stroke="#1C1C2A" strokeWidth="1"/>)}
          {yTicks.map((t,i) => <text key={i} x={pad.l-6} y={t.y} textAnchor="end" dominantBaseline="middle" fill="#323248" fontSize="11" fontFamily="DM Sans,sans-serif">{t.label}</text>)}
          {xTicks.map((t,i) => <text key={i} x={t.x} y={H-5} textAnchor="middle" fill="#323248" fontSize="11" fontFamily="DM Sans,sans-serif">{t.label}</text>)}
          <path d={eArea} fill="url(#gG)"/>
          <path d={nArea} fill="url(#tG)"/>
          <path d={eLine} fill="none" stroke="#F5C842" strokeWidth="2"/>
          <path d={nLine} fill="none" stroke="#00D9A0" strokeWidth="2"/>
        </svg>
      );
    }

    function App() {
      const [curAge,   setCurAge]   = useState(28);
      const [startAge, setStartAge] = useState(22);
      const [monthly,  setMonthly]  = useState(5000);
      const [rate,     setRate]     = useState(12);
      const [res,      setRes]      = useState(null);
      const [animated, setAnimated] = useState(0);
      const RETIRE = 60;

      const sipFV = (years, mo, mr) =>
        years <= 0 ? 0 : mo * ((Math.pow(1+mr, years*12)-1)/mr) * (1+mr);

      const calculate = () => {
        if (startAge >= curAge) return;
        const mr   = rate / 100 / 12;
        const fvE  = sipFV(RETIRE - startAge, monthly, mr);
        const fvN  = sipFV(RETIRE - curAge,   monthly, mr);
        const cost = Math.max(0, fvE - fvN);
        const yLost = curAge - startAge;
        const data = [];
        for (let age = startAge; age <= RETIRE; age++) {
          data.push({
            age,
            early: Math.round(sipFV(age - startAge, monthly, mr)),
            now:   Math.round(sipFV(Math.max(0, age - curAge), monthly, mr)),
          });
        }
        setRes({ fvE, fvN, cost, yLost, data });
        setAnimated(0);
      };

      useEffect(() => {
        if (!res?.cost) return;
        const target = res.cost, t0 = performance.now(), dur = 1900;
        const run = (t) => {
          const p = Math.min((t-t0)/dur, 1);
          setAnimated(target * (1 - Math.pow(1-p, 3)));
          if (p < 1) requestAnimationFrame(run);
        };
        requestAnimationFrame(run);
      }, [res]);

      const invalid = startAge >= curAge;

      const sliders = [
        { label:"Your current age",         val:curAge,   min:18, max:55,               step:1,   cls:"gold", col:"#F5C842",
          display:() => <>{curAge}<small>yrs</small></>,
          set:(v) => { setCurAge(v); if(startAge>=v) setStartAge(Math.max(15,v-1)); } },
        { label:"Age you could've started", val:startAge, min:15, max:Math.max(15,curAge-1), step:1, cls:"gold", col:"#F5C842",
          display:() => <>{startAge}<small>yrs</small></>,
          set:setStartAge },
        { label:"Monthly SIP amount",       val:monthly,  min:500,max:100000,           step:500,  cls:"teal", col:"#00D9A0",
          display:() => <>{fmtMonthly(monthly)}</>,
          set:setMonthly },
        { label:"Expected annual return",   val:rate,     min:6,  max:18,               step:0.5,  cls:"teal", col:"#00D9A0",
          display:() => <>{rate}<small>%</small></>,
          set:setRate },
      ];

      return (
        <div className="app">
          <div className="glow-bg" />
          <div className="wrap">
            <div className="eyebrow">Financial Reality Check · Wiser With Vidhaan</div>
            <h1 className="hero-title">The <em>Delay</em><br />Cost Engine</h1>
            <p className="hero-sub">Find out exactly what starting late has cost you — in rupees, not lectures.</p>

            <div className="card">
              <div className="card-label">Your Numbers</div>
              {sliders.map((s, i) => (
                <div className="sg" key={i}>
                  <div className="sh">
                    <span className="sn">{s.label}</span>
                    <div className="sv">{s.display()}</div>
                  </div>
                  <input type="range" className={`rng-${s.cls}`}
                    min={s.min} max={s.max} step={s.step} value={s.val}
                    style={trackBg(s.val, s.min, s.max, s.col)}
                    onChange={e => s.set(s.step < 1 ? parseFloat(e.target.value) : parseInt(e.target.value))} />
                </div>
              ))}
              {invalid && <div className="err-msg">Set "could've started" age to earlier than your current age.</div>}
              <button className="cta-btn" onClick={calculate} disabled={invalid}>Show Me The Cost →</button>
            </div>

            {res && (
              <div className="results">
                <div className="badge-row">
                  <div className="badge">🔓 Truth Unlocked — Reality check complete</div>
                </div>

                <div className="grid2">
                  <div className="rcard gold">
                    <div className="rtag gold">If started at {startAge}</div>
                    <div className="ramt">{fmt(res.fvE)}</div>
                    <div className="rdsc">by age {RETIRE}</div>
                  </div>
                  <div className="rcard teal">
                    <div className="rtag teal">Starting now at {curAge}</div>
                    <div className="ramt">{fmt(res.fvN)}</div>
                    <div className="rdsc">by age {RETIRE}</div>
                  </div>
                </div>

                <div className="cost-card">
                  <div className="cost-card-glow" />
                  <div className="clabel">The Delay Cost</div>
                  <div className="camt">{fmt(animated)}</div>
                  <div className="csub">{res.yLost} year{res.yLost !== 1 ? "s" : ""} of compounding you didn't get</div>
                  <div className="cverdict">"{verdict(res.yLost, res.cost)}"</div>
                </div>

                <div className="chart-card">
                  <div className="ctitle">The Wealth Gap, Visualised</div>
                  <div className="cdesc">Two wealth curves — same SIP, same return, different start dates.</div>
                  <div className="legend">
                    <div className="li"><div className="ld" style={{background:"#F5C842"}}/><span>Started at {startAge}</span></div>
                    <div className="li"><div className="ld" style={{background:"#00D9A0"}}/><span>Starting at {curAge}</span></div>
                  </div>
                  <SVGTwoLines data={res.data} startAge={startAge} curAge={curAge} />
                </div>

                <div className="cta-end">
                  <div className="cta-title">The best time was then.<br />The second best time is right now.</div>
                  <div className="cta-sub">Every month you wait, this number grows. Not slowly.</div>
                  <div className="div-line" />
                  <div className="tool-links">
                    <a href="/compounding-machine" className="tool-link gold">The Compounding Machine →</a>
                    <a href="/investor-dna" className="tool-link ghost">Find Your Investor DNA</a>
                    <a href="/sip-flat-returns" className="tool-link ghost">SIP Flat Returns</a>
                  </div>
                  <div className="div-line" style={{marginTop:28}} />
                  <a href="https://calendly.com/vidhaanjain/investmentfirst" target="_blank" rel="noopener noreferrer" style={{display:"block",background:"rgba(245,200,66,0.05)",border:"1px solid rgba(245,200,66,0.22)",borderRadius:14,padding:"22px 24px",textDecoration:"none",marginTop:16,textAlign:"left"}}>
                    <div style={{fontSize:10,letterSpacing:"0.14em",textTransform:"uppercase",color:"#F5C842",fontWeight:600,marginBottom:8,fontFamily:"DM Sans,sans-serif"}}>1:1 Consultation · ₹999 · 45 min</div>
                    <div style={{fontFamily:"DM Serif Display,serif",fontSize:"clamp(18px,2.5vw,22px)",color:"#EDE9E3",marginBottom:6,lineHeight:1.3}}>Book a session with Vidhaan →</div>
                    <div style={{fontSize:13,color:"#5A5A70",lineHeight:1.7,fontFamily:"DM Sans,sans-serif"}}>We'll look at your actual numbers — income, EMIs, goals — and build a plan you'll actually follow. Payment details shared after booking.</div>
                  </a>
                  <a href="https://wisermoney.vercel.app" target="_blank" rel="noopener noreferrer" style={{display:"block",background:"transparent",border:"1px solid #1A1A28",borderRadius:14,padding:"18px 24px",textDecoration:"none",marginTop:10,textAlign:"left"}}>
                    <div style={{fontSize:10,letterSpacing:"0.14em",textTransform:"uppercase",color:"#00D9A0",fontWeight:600,marginBottom:6,fontFamily:"DM Sans,sans-serif"}}>Full Assessment · wisermoney.vercel.app ↗</div>
                    <div style={{fontSize:13,color:"#5A5A70",lineHeight:1.65,fontFamily:"DM Sans,sans-serif"}}>Want the complete picture? Income, expenses, insurance, EMIs — a full financial health assessment across 8 investor archetypes.</div>
                  </a>
                </div>
              </div>
            )}

            <div className="footer-line">WISER WITH VIDHAAN · CALCULATIONS ARE ILLUSTRATIVE · NOT FINANCIAL ADVICE</div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
