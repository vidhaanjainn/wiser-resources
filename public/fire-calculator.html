<!DOCTYPE html>
<html lang="en">
<head>

  <style>

    html,body,#root{min-height:100%;background:#090B0F;}
    .app{min-height:100vh;background:#090B0F;color:#EDE9E3;font-family:'DM Sans',sans-serif;}
    .glow-bg{position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 80% 5%,rgba(245,200,66,0.06) 0%,transparent 60%),radial-gradient(ellipse 40% 40% at 10% 90%,rgba(0,217,160,0.04) 0%,transparent 60%);pointer-events:none;z-index:0;}
    .wrap{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:56px 24px 96px;}
    .eyebrow{font-size:11px;font-weight:600;letter-spacing:3.5px;text-transform:uppercase;color:#F5C842;margin-bottom:16px;}
    .hero-title{font-family:'DM Serif Display',serif;font-size:clamp(44px,7vw,76px);line-height:1.0;color:#EDE9E3;margin-bottom:18px;letter-spacing:-1px;}
    .hero-title em{font-style:italic;color:#F5C842;}
    .hero-sub{font-size:16px;color:#5A5A70;line-height:1.75;max-width:520px;margin-bottom:60px;font-weight:300;}
    .card{background:#0D0D18;border:1px solid #1A1A28;border-radius:20px;padding:32px;margin-bottom:20px;}
    .card-label{font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#2E2E42;margin-bottom:28px;}
    .sg{margin-bottom:32px;}
    .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
    .sn{font-size:13px;color:#606078;font-weight:400;}

    .sv small{font-size:13px;color:#404058;font-family:'DM Sans',sans-serif;margin-left:4px;font-weight:400;}
    .sv-input{font-family:'DM Serif Display',serif;font-size:26px;color:#EDE9E3;background:transparent;border:none;border-bottom:1.5px solid transparent;outline:none;text-align:right;max-width:220px;padding-bottom:2px;cursor:pointer;transition:border-color .15s,color .15s;line-height:1;}
    .sv-input:hover{border-bottom-color:#2A2A3A;}
    .sv-input:focus{border-bottom-color:#F5C842;cursor:text;color:#F5C842;}
    .sv-hint{font-size:10px;color:#2A2A3A;text-align:right;margin-top:4px;letter-spacing:.5px;}
    input[type=range]{-webkit-appearance:none;width:100%;height:2px;border-radius:2px;outline:none;cursor:pointer;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;cursor:pointer;transition:transform .15s,box-shadow .15s;}
    input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);}
    .rng-gold::-webkit-slider-thumb{background:#F5C842;box-shadow:0 0 0 5px rgba(245,200,66,0.14);}
    .rng-teal::-webkit-slider-thumb{background:#00D9A0;box-shadow:0 0 0 5px rgba(0,217,160,0.14);}
    .cta-btn{width:100%;padding:19px;background:#F5C842;color:#090B0F;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;border:none;border-radius:12px;cursor:pointer;text-transform:uppercase;transition:background .15s,transform .15s,box-shadow .2s;margin-top:28px;}
    .cta-btn:hover{background:#FFD84A;transform:translateY(-2px);box-shadow:0 16px 48px rgba(245,200,66,0.22);}
    .adv-toggle{display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;color:#404058;font-size:12px;font-family:'DM Sans',sans-serif;padding:0;margin-top:20px;letter-spacing:.5px;}
    .adv-toggle:hover{color:#9090A8;}
    .adv-section{margin-top:24px;padding-top:24px;border-top:1px solid #1A1A28;}
    .adv-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;}
    @media(max-width:560px){.adv-grid{grid-template-columns:1fr;}}
    .adv-label{font-size:11px;color:#404058;margin-bottom:6px;}
    .adv-val{font-family:'DM Serif Display',serif;font-size:20px;color:#EDE9E3;margin-bottom:8px;}
    .adv-hint{font-size:10px;color:#2A2A3A;margin-top:6px;}

    /* ── Results ── */
    .results{animation:fadeUp .6s cubic-bezier(0.22,1,0.36,1) forwards;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
    .badge-row{display:flex;justify-content:center;margin-bottom:28px;}
    .badge{display:inline-flex;align-items:center;gap:8px;background:rgba(245,200,66,0.08);border:1px solid rgba(245,200,66,0.22);border-radius:100px;padding:8px 20px;font-size:12px;color:#F5C842;font-weight:500;}

    /* ── FIRE Hero ── */
    .fire-hero{background:#0A0B10;border:1px solid rgba(245,200,66,0.22);border-radius:24px;padding:44px 32px 36px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden;}
    .fire-hero-glow{position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:500px;height:260px;background:radial-gradient(ellipse,rgba(245,200,66,0.12),transparent 65%);pointer-events:none;}
    .lf-toggle{display:inline-flex;background:#141420;border:1px solid #1A1A28;border-radius:30px;padding:3px;gap:2px;margin-bottom:24px;position:relative;z-index:1;}
    .lf-btn{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:7px 18px;border-radius:24px;border:none;cursor:pointer;transition:all .2s;background:transparent;color:#404058;font-family:'DM Sans',sans-serif;}
    .lf-btn.active{background:#F5C842;color:#090B0F;}
    .fire-label{font-size:10px;font-weight:700;letter-spacing:3.5px;text-transform:uppercase;color:#F5C842;margin-bottom:16px;position:relative;}

    /* ── Freedom Date ── */

    .freedom-eyebrow{font-size:10px;font-weight:700;letter-spacing:3.5px;text-transform:uppercase;color:#404058;margin-bottom:14px;}
    .freedom-date{font-family:'DM Serif Display',serif;font-size:clamp(36px,6vw,60px);color:#EDE9E3;line-height:1;letter-spacing:-1px;margin-bottom:12px;}
    .freedom-date em{font-style:italic;color:#F5C842;}
    .freedom-meta{display:flex;gap:24px;flex-wrap:wrap;}
    .freedom-stat{font-size:13px;color:#5A5A70;line-height:1.5;}
    .freedom-stat strong{color:#EDE9E3;font-weight:500;display:block;font-size:15px;margin-bottom:2px;}
    .freedom-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-top:16px;}
    .freedom-tag.early{background:rgba(0,217,160,0.08);color:#00D9A0;border:1px solid rgba(0,217,160,0.2);}
    .freedom-tag.late{background:rgba(255,160,80,0.08);color:#FFB060;border:1px solid rgba(255,160,80,0.2);}
    .freedom-tag.exact{background:rgba(245,200,66,0.08);color:#F5C842;border:1px solid rgba(245,200,66,0.2);}

    /* ── Story Stats ── */
    .story-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
    @media(max-width:600px){.story-grid{grid-template-columns:1fr;}}
    .story-card{background:#0D0D18;border:1px solid #1A1A28;border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;}
    .story-tag{font-size:9.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;width:100%;text-align:left;}
    .story-tag.teal{color:#00D9A0;}.story-tag.gold{color:#F5C842;}.story-tag.mute{color:#404058;}
    .story-num{font-family:'DM Serif Display',serif;font-size:clamp(22px,3vw,30px);color:#EDE9E3;line-height:1;margin-bottom:6px;}
    .story-desc{font-size:11px;color:#363650;line-height:1.55;}
    .story-boost{font-size:11px;color:#00D9A0;margin-top:8px;padding:5px 10px;background:rgba(0,217,160,0.06);border-radius:8px;border:1px solid rgba(0,217,160,0.12);}

    /* ── Progress Ring ── */

    .ring-fill{fill:none;stroke-linecap:round;stroke-width:8;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.8s cubic-bezier(0.22,1,0.36,1);}
    .ring-text-pct{font-family:'DM Serif Display',serif;font-size:18px;fill:#EDE9E3;}
    .ring-text-sub{font-size:9px;fill:#404058;font-family:'DM Sans',sans-serif;}

    /* ── Charts ── */
    .chart-card{background:#0D0D18;border:1px solid #1A1A28;border-radius:20px;padding:32px;margin-bottom:16px;}
    .ctitle{font-family:'DM Serif Display',serif;font-size:21px;color:#EDE9E3;margin-bottom:7px;}
    .cdesc{font-size:13px;color:#363650;margin-bottom:22px;line-height:1.6;}
    .legend{display:flex;gap:20px;margin-bottom:16px;flex-wrap:wrap;}
    .li{display:flex;align-items:center;gap:8px;font-size:12px;color:#5A5A70;}
    .ld{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

    @keyframes firePulse{0%,100%{r:5;opacity:1;}50%{r:8;opacity:0.5;}}

    /* ── Insights Strip ── */
    .insights-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
    @media(max-width:600px){.insights-row{grid-template-columns:1fr;}}

    .ic-icon{font-size:22px;margin-bottom:10px;}
    .ic-val{font-family:'DM Serif Display',serif;font-size:clamp(18px,2.5vw,24px);color:#F5C842;line-height:1;margin-bottom:6px;}
    .ic-label{font-size:12px;color:#404058;line-height:1.55;}

    /* ── Savings Rate Table ── */
    .sr-context{background:#0A0A14;border:1px solid #1A1A28;border-radius:12px;padding:14px 16px;margin-bottom:18px;font-size:13px;color:#5A5A70;line-height:1.75;}
    .sr-context strong{color:#EDE9E3;}
    .sr-context em{color:#F5C842;font-style:normal;font-weight:600;}
    .sr-dual-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
    .sr-force{border-radius:12px;padding:14px 16px;}
    .sr-force.up{background:rgba(0,217,160,0.05);border:1px solid rgba(0,217,160,0.12);}
    .sr-force.down{background:rgba(245,200,66,0.04);border:1px solid rgba(245,200,66,0.12);}
    .sr-force-icon{font-size:18px;margin-bottom:6px;}
    .sr-force-title{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;}
    .sr-force.up .sr-force-title{color:#00D9A0;}
    .sr-force.down .sr-force-title{color:#F5C842;}
    .sr-force-body{font-size:12px;color:#5A5A70;line-height:1.6;}
    .sr-force-body strong{color:#EDE9E3;}
    .sr-table{width:100%;border-collapse:collapse;}
    .sr-table th{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#2A2A3A;padding:0 8px 10px;border-bottom:1px solid #1A1A28;text-align:left;}
    .sr-table th:last-child{text-align:right;padding-right:0;}
    .sr-table td{padding:10px 8px;border-bottom:1px solid #0F0F1C;font-size:13px;vertical-align:middle;}
    .sr-table td:first-child{padding-left:0;}
    .sr-table td:last-child{padding-right:0;}
    .sr-table tr:last-child td{border-bottom:none;}
    .sr-table tr.sr-current td{background:rgba(245,200,66,0.025);}
    .sr-fire-badge{display:inline-block;font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:6px;letter-spacing:.5px;margin-left:5px;vertical-align:middle;}
    .sr-fire-badge.faster{background:rgba(0,217,160,0.1);color:#00D9A0;border:1px solid rgba(0,217,160,0.15);}
    .sr-fire-badge.current{background:rgba(245,200,66,0.1);color:#F5C842;border:1px solid rgba(245,200,66,0.2);}
    .sr-nextstep{margin-top:18px;padding:16px;background:#0A0A14;border:1px solid #1A1A28;border-left:2px solid #00D9A0;border-radius:0 10px 10px 0;font-size:13px;color:#5A5A70;line-height:1.75;}
    .sr-nextstep strong{color:#EDE9E3;}
    .sr-nextstep em{color:#00D9A0;font-style:normal;}
    @keyframes barIn{from{width:0!important;}to{}}

    /* ── Stress toggle ── */
    .stress-toggle{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid #1A1A28;color:#5A5A70;font-size:12px;font-family:'DM Sans',sans-serif;padding:7px 14px;border-radius:10px;cursor:pointer;margin-top:14px;transition:border-color .15s,color .15s;}
    .stress-toggle:hover{border-color:#363650;color:#9090A8;}
    .stress-toggle.on{border-color:rgba(255,120,80,0.3);color:#FF9060;}

    /* ── CTA ── */
    .cta-end{background:#0A0A14;border:1px solid rgba(245,200,66,0.14);border-radius:20px;padding:38px;text-align:center;margin-bottom:0;}
    .cta-title{font-family:'DM Serif Display',serif;font-size:clamp(20px,3vw,27px);color:#EDE9E3;margin-bottom:10px;line-height:1.35;}
    .cta-sub{font-size:14px;color:#404058;line-height:1.8;}
    .div-line{height:1px;background:#1A1A28;margin:24px 0;}
    .tool-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
    .tool-link{display:inline-flex;align-items:center;gap:6px;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;text-decoration:none;transition:transform .12s,opacity .12s;}
    .tool-link:hover{transform:translateY(-1px);opacity:.88;}
    .tool-link.gold{background:#F5C842;color:#090B0F;}
    .tool-link.ghost{background:transparent;border:1px solid #1A1A28;color:#5A5A70;}
    .footer-line{margin-top:40px;text-align:center;font-size:10px;color:#20202E;letter-spacing:2.5px;}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
  const { useState, useEffect, useRef, useCallback } = React;

  /* ── Formatters ── */
  const fmt = (n) => {
    if (n == null || isNaN(n) || n < 0) return "₹0";
    if (n >= 1e7) return `₹${(n / 1e7).toFixed(2)} Cr`;
    if (n >= 1e5) return `₹${(n / 1e5).toFixed(1)} L`;
    return `₹${Math.round(n).toLocaleString("en-IN")}`;
  };
  const fmtShort = (n) => {
    if (n == null || isNaN(n) || n < 0) return "₹0";
    if (n >= 1e7) return `₹${(n / 1e7).toFixed(1)}Cr`;
    if (n >= 1e5) return `₹${(n / 1e5).toFixed(0)}L`;
    if (n >= 1e3) return `₹${(n / 1e3).toFixed(0)}K`;
    return `₹${Math.round(n)}`;
  };
  const fmtDisplay = (v) => {
    if (v === 0) return "₹0";
    if (v >= 1e7) return `₹${(v / 1e7).toFixed(2)} Cr`;
    if (v >= 1e5) return `₹${(v / 1e5).toFixed(1)} L`;
    return `₹${Math.round(v).toLocaleString("en-IN")}`;
  };
  const trackBg = (val, min, max, col) => {
    const pct = Math.round(((Math.min(val, max) - min) / (max - min)) * 100);
    return { background: `linear-gradient(to right,${col} ${pct}%,#1A1A28 ${pct}%)` };
  };
  const getFireDate = (yearsFromNow) => {
    if (!yearsFromNow) return null;
    const d = new Date();
    d.setFullYear(d.getFullYear() + yearsFromNow);
    return d.toLocaleString('en-IN', { month: 'long', year: 'numeric' });
  };

  /* ── Core Math ── */
  const sipFV = (monthly, annualRate, years) => {
    if (years <= 0 || monthly <= 0) return 0;
    const mr = annualRate / 100 / 12;
    if (mr === 0) return monthly * 12 * years;
    return monthly * ((Math.pow(1 + mr, 12 * years) - 1) / mr) * (1 + mr);
  };
  const lumpFV = (lump, annualRate, years) => {
    if (years <= 0) return lump;
    if (annualRate === 0) return lump;
    return lump * Math.pow(1 + annualRate / 100, years);
  };

  const calcFIRE = ({ monthlyExpense, currentAge, fireAge, monthlyInvest, currentCorpus, inflation, returnRate, swr }) => {
    const yearsToTarget = Math.max(1, fireAge - currentAge);
    const inf = inflation / 100;
    const swrDec = swr / 100;
    const mr = returnRate / 100 / 12;

    // Inflation-adjusted annual expense at target retirement age
    const futureAnnualExpense = monthlyExpense * 12 * Math.pow(1 + inf, yearsToTarget);
    const fireNumber = futureAnnualExpense / swrDec;

    // Fat FIRE = +40% lifestyle buffer
    const fatFutureAnnual = monthlyExpense * 1.4 * 12 * Math.pow(1 + inf, yearsToTarget);
    const fatFireNumber = fatFutureAnnual / swrDec;

    // Find FIRE crossover year (iterate up to 50 yrs)
    let actualFireYear = null;
    const yearlyData = [];
    for (let y = 1; y <= 50; y++) {
      const corpus = sipFV(monthlyInvest, returnRate, y) + lumpFV(currentCorpus, returnRate, y);
      const fireNeededAtY = (monthlyExpense * 12 * Math.pow(1 + inf, y)) / swrDec;
      yearlyData.push({ year: y, age: currentAge + y, corpus: Math.round(corpus), fireNeeded: Math.round(fireNeededAtY) });
      if (actualFireYear === null && corpus >= fireNeededAtY) actualFireYear = y;
    }

    // Coast FIRE
    const coastFIRE = fireNumber / Math.pow(1 + returnRate / 100, yearsToTarget);
    const isCoasted = currentCorpus >= coastFIRE;
    const coastPct = Math.min(100, (currentCorpus / coastFIRE) * 100);

    // SIP needed to hit fireNumber by target age
    const sipMultiplier = mr > 0
      ? ((Math.pow(1 + mr, 12 * yearsToTarget) - 1) / mr) * (1 + mr)
      : 12 * yearsToTarget;
    const sipNeeded = sipMultiplier > 0
      ? Math.max(0, (fireNumber - lumpFV(currentCorpus, returnRate, yearsToTarget)) / sipMultiplier)
      : 0;
    const sipDelta = monthlyInvest - sipNeeded;

    // +₹5,000/mo boost: how many months earlier does FIRE happen?
    let boostFireYear = actualFireYear;
    for (let y = 1; y <= 50; y++) {
      const c = sipFV(monthlyInvest + 5000, returnRate, y) + lumpFV(currentCorpus, returnRate, y);
      const fn = (monthlyExpense * 12 * Math.pow(1 + inf, y)) / swrDec;
      if (c >= fn) { boostFireYear = y; break; }
    }
    const boostMonths = actualFireYear !== null && boostFireYear !== null
      ? Math.max(0, (actualFireYear - boostFireYear) * 12)
      : 0;

    // Progress: current corpus as % of fireNumber
    const progressPct = Math.min(100, (currentCorpus / fireNumber) * 100);

    // Current passive income from existing corpus at SWR
    const currentPassiveMonthly = Math.round(currentCorpus * swrDec / 12);

    // Monthly passive income at FIRE (simply = futureAnnualExpense / 12 = expenses covered)
    const fireMonthlyIncome = Math.round(futureAnnualExpense / 12);

    // Investment multiple: ₹1 invested today → ₹X at fireNumber/totalInvested ratio
    const totalInvested = monthlyInvest * 12 * yearsToTarget + currentCorpus;
    const investmentMultiple = totalInvested > 0 ? (fireNumber / totalInvested).toFixed(1) : "—";

    // Post-FIRE corpus (base 9%, bear 7%) from fireNumber to age 90
    const retirementYears = Math.max(25, 90 - fireAge);
    const postBase = [], postBear = [];
    let cBase = fireNumber, cBear = fireNumber;
    for (let y = 0; y <= retirementYears; y++) {
      postBase.push({ age: fireAge + y, corpus: Math.max(0, cBase) });
      postBear.push({ age: fireAge + y, corpus: Math.max(0, cBear) });
      const wd = futureAnnualExpense * Math.pow(1 + inf, y);
      cBase = cBase * 1.09 - wd;
      cBear = cBear * 1.07 - wd;
    }
    const baseCorpusAt90 = postBase[postBase.length - 1]?.corpus || 0;
    const bearDepleted = postBear.findIndex(d => d.corpus === 0 && d.age > fireAge);
    const bearDepletedAge = bearDepleted > 0 ? postBear[bearDepleted]?.age : null;

    // Savings rate rows
    const impliedIncome = monthlyExpense + monthlyInvest;
    const currentSRPct = impliedIncome > 0 ? (monthlyInvest / impliedIncome) * 100 : 0;
    const srRows = [];
    for (let sr = 10; sr <= 75; sr += 5) {
      const srMonthly = impliedIncome * (sr / 100);
      const srSpend = impliedIncome * (1 - sr / 100);
      let srYear = null;
      for (let y = 1; y <= 50; y++) {
        const c = sipFV(srMonthly, returnRate, y) + lumpFV(currentCorpus, returnRate, y);
        const fn = (srSpend * 12 * Math.pow(1 + inf, y)) / swrDec;
        if (c >= fn) { srYear = y; break; }
      }
      srRows.push({ sr, years: srYear });
    }

    return {
      fireNumber, fatFireNumber, futureAnnualExpense, fatFutureAnnual,
      yearsToTarget, actualFireYear,
      actualFireAge: actualFireYear !== null ? currentAge + actualFireYear : null,
      coastFIRE, isCoasted, coastPct,
      sipNeeded, sipDelta, boostMonths,
      progressPct, currentPassiveMonthly, fireMonthlyIncome,
      investmentMultiple,
      yearlyData, postBase, postBear, baseCorpusAt90, bearDepletedAge,
      currentSRPct, srRows,
      freedomYears: actualFireYear !== null ? 90 - (currentAge + actualFireYear) : null,
    };
  };

  /* ── Count-up hook ── */
  function useCountUp(target, dur = 1900) {
    const [val, setVal] = useState(0);
    const prev = useRef(null);
    useEffect(() => {
      if (target === prev.current) return;
      prev.current = target;
      const t0 = performance.now();
      const run = (t) => {
        const p = Math.min((t - t0) / dur, 1);
        setVal(target * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(run);
      };
      requestAnimationFrame(run);
    }, [target]);
    return val;
  }

  /* ── Editable NumInput ── */
  function NumInput({ value, min, max, set }) {
    const [editing, setEditing] = useState(false);
    const [draft, setDraft] = useState("");
    const ref = useRef();
    const onFocus = () => { setEditing(true); setDraft(String(value)); setTimeout(() => ref.current?.select(), 0); };
    const onChange = (e) => {
      const raw = e.target.value.replace(/[^0-9]/g, "");
      setDraft(raw);
      const n = parseInt(raw, 10);
      if (!isNaN(n)) set(Math.min(max, Math.max(min, n)));
    };
    const onBlur = () => {
      setEditing(false);
      const n = parseInt(draft.replace(/[^0-9]/g, ""), 10);
      set(isNaN(n) ? min : Math.min(max, Math.max(min, n)));
    };
    return (
      <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end" }}>
        <input ref={ref} type="text" inputMode="numeric" className="sv-input"
          value={editing ? draft : fmtDisplay(value)}
          onFocus={onFocus} onChange={onChange} onBlur={onBlur}
          onKeyDown={e => e.key === "Enter" && ref.current?.blur()} />
        <div className="sv-hint">{editing ? `max ${fmtDisplay(max)}` : "tap to edit"}</div>
      </div>
    );
  }

  /* ── Progress Ring ── */
  function ProgressRing({ pct }) {
    const r = 44, circ = 2 * Math.PI * r;
    const offset = circ * (1 - Math.min(pct, 100) / 100);

        <circle cx="50" cy="50" r={r} className="ring-track" />
        <circle cx="50" cy="50" r={r} className="ring-fill"
          stroke={col} strokeDasharray={`${circ}`} strokeDashoffset={`${offset}`} />
        <text x="50" y="47" textAnchor="middle" dominantBaseline="middle" className="ring-text-pct">

  /* ── Path to FIRE Chart (animated) ── */
  function PathChart({ data, fireYear }) {
    const W = 600, H = 230;
    const pad = { t: 10, r: 14, b: 30, l: 52 };
    const cW = W - pad.l - pad.r, cH = H - pad.t - pad.b;
    const maxY = fireYear ? Math.min(50, fireYear + 6) : 50;
    const subset = data.slice(0, maxY);
    const n = subset.length;
    if (n === 0) return null;
    const maxVal = Math.max(...subset.map(d => Math.max(d.corpus, d.fireNeeded)), 1);
    const xS = (i) => pad.l + (i / Math.max(n - 1, 1)) * cW;
    const yS = (v) => pad.t + cH - (Math.max(0, v) / maxVal) * cH;
    const corpusLine = subset.map((d, i) => `${i === 0 ? "M" : "L"}${xS(i).toFixed(1)},${yS(d.corpus).toFixed(1)}`).join(" ");
    const fireLine   = subset.map((d, i) => `${i === 0 ? "M" : "L"}${xS(i).toFixed(1)},${yS(d.fireNeeded).toFixed(1)}`).join(" ");
    const areaPath   = `${corpusLine} L${xS(n-1).toFixed(1)},${yS(0).toFixed(1)} L${xS(0).toFixed(1)},${yS(0).toFixed(1)}Z`;
    const yTicks = [0, 0.25, 0.5, 0.75, 1].map(t => ({ v: t*maxVal, y: yS(t*maxVal), label: fmtShort(Math.round(t*maxVal)) }));
    const step = Math.max(1, Math.ceil(n / 6));
    const xTicks = subset.reduce((a, d, i) => {
      if (i === 0 || i === n-1 || i % step === 0) a.push({ x: xS(i), label: d.year });
      return a;
    }, []);
    const fireX = (fireYear && fireYear <= maxY) ? xS(fireYear - 1) : null;
    const fireY2 = (fireYear && fireYear <= maxY && subset[fireYear - 1]) ? yS(subset[fireYear - 1].corpus) : null;

    return (
      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: "block" }}>
        <defs>
          <linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#F5C842" stopOpacity="0.16" />
            <stop offset="100%" stopColor="#F5C842" stopOpacity="0.01" />
          </linearGradient>
        </defs>
        {yTicks.map((t, i) => <line key={i} x1={pad.l} x2={W-pad.r} y1={t.y} y2={t.y} stroke="#1A1A28" strokeWidth="1"/>)}
        {yTicks.map((t, i) => <text key={i} x={pad.l-6} y={t.y} textAnchor="end" dominantBaseline="middle" fill="#2A2A38" fontSize="11" fontFamily="DM Sans,sans-serif">{t.label}</text>)}
        {xTicks.map((t, i) => <text key={i} x={t.x} y={H-5} textAnchor="middle" fill="#2A2A38" fontSize="11" fontFamily="DM Sans,sans-serif">Yr {t.label}</text>)}
        <path d={areaPath} fill="url(#areaG)" />
        <path d={fireLine} fill="none" stroke="rgba(0,217,160,0.2)" strokeWidth="1.5" strokeDasharray="6,4"/>
        <path d={corpusLine} fill="none" stroke="#F5C842" strokeWidth="2.5"
          pathLength="1000"
          style={{ strokeDasharray: 1000, animation: "drawLine 1.8s cubic-bezier(0.22,1,0.36,1) forwards" }} />
        {fireX !== null && fireY2 !== null && (
          <>
            <line x1={fireX} x2={fireX} y1={pad.t} y2={H-pad.b} stroke="rgba(0,217,160,0.3)" strokeWidth="1" strokeDasharray="4,4"/>
            <circle cx={fireX} cy={fireY2} r="6" fill="#00D9A0" style={{ animation: "firePulse 2s ease-in-out 1.8s infinite" }}/>

          </>
        )}
      </svg>
    );
  }

                  <div className="ic-icon">📈</div>
                  <div className="ic-val">{res.investmentMultiple}×</div>
                  <div className="ic-label">Every rupee you invest across the journey becomes {res.investmentMultiple}× at your FIRE number — the market multiplies your discipline</div>
                </div>
                <div className="insight-chip">
                  <div className="ic-icon">🏖️</div>
                  <div className="ic-val">{res.freedomYears ?? "—"} yrs</div>
                  <div className="ic-label">of complete financial freedom — from age {res.actualFireAge} to 90. That's time your money works, not you</div>
                </div>
                <div className="insight-chip">
                  <div className="ic-icon">⚡</div>
                  <div className="ic-val">{res.boostMonths > 0 ? `${res.boostMonths}mo` : "—"}</div>
                  <div className="ic-label">earlier FIRE if you add just ₹5,000 more per month to your SIP — the smallest lever, the biggest shift</div>
                </div>
              </div>

              {/* Path to FIRE Chart */}
              <div className="chart-card">
                <div className="ctitle">Path to FIRE</div>
                <div className="cdesc">Gold line: your growing corpus. Dashed: the FIRE threshold (grows with inflation). Where they cross — that's your freedom moment.</div>
                <div className="legend">
                  <div className="li"><div className="ld" style={{background:"#F5C842"}} /><span>Your corpus</span></div>
                  <div className="li"><div className="ld" style={{background:"rgba(0,217,160,0.35)"}} /><span>FIRE threshold</span></div>
                  {res.actualFireYear && <div className="li"><div className="ld" style={{background:"#00D9A0"}} /><span>FIRE crossover</span></div>}
                </div>
                <PathChart data={res.yearlyData} fireYear={res.actualFireYear} />
              </div>

              {/* Corpus Survival */}
              <div className="chart-card">
                <div className="ctitle">Does Your Corpus Last to 90?</div>
                <div className="cdesc">
                  {showBear
                    ? "Downside scenario (7% returns post-retirement). Your corpus withdrawing inflation-adjusted expenses each year."
                    : "Base scenario (9% returns post-retirement). Your corpus after paying yourself each year, to age 90."}
                </div>
                <div style={{marginBottom:16}}>
                  {showBear ? (
                    res.bearDepletedAge
                      ? <span style={{fontSize:13,color:"#FF9060"}}>⚠ Corpus depletes at age {res.bearDepletedAge} in this scenario</span>
                      : <span style={{fontSize:13,color:"#00D9A0"}}>✓ Corpus survives to 90+ even in downside scenario</span>
                  ) : (
                    <span style={{fontSize:13,color:"#00D9A0"}}>
                      Corpus at age 90: <strong>{fmt(res.baseCorpusAt90)}</strong> — your wealth outlives you
                    </span>
                  )}
                </div>
                <SurvivalChart postBase={res.postBase} postBear={res.postBear} showBear={showBear} key={showBear ? "bear" : "base"} />
                <button className={`stress-toggle${showBear ? " on" : ""}`} onClick={() => setShowBear(v => !v)}>
                  {showBear ? "← Show base scenario" : "⚡ Show downside stress test"}
                </button>
              </div>

              {/* Savings Rate Lever */}
              <div className="chart-card">
                <div className="ctitle">The Savings Rate Lever</div>
                <div className="cdesc">
                  Your savings rate is what % of your income you invest vs spend. It's the most powerful FIRE lever — because it attacks the problem from both ends at once.
                </div>

                {/* Context: your current numbers */}
                {(() => {
                  const income = monthlyExpense + monthlyInvest;
                  const currentSR = Math.round(res.currentSRPct);
                  return (
                    <div className="sr-context">
                      You earn <strong>{fmt(income)}/mo</strong>. You currently invest <strong>{fmt(monthlyInvest)}</strong> and spend <strong>{fmt(monthlyExpense)}</strong> — a <em>~{currentSR}% savings rate</em>. The table shows your FIRE timeline at every savings rate.
                    </div>
                  );
                })()}

                {/* The two forces */}
                <div className="sr-dual-grid">
                  <div className="sr-force up">
                    <div className="sr-force-icon">↑</div>
                    <div className="sr-force-title">Force 1: More goes in</div>
                    <div className="sr-force-body">Every extra rupee saved goes straight into your SIP. <strong>Your corpus grows faster.</strong></div>
                  </div>
                  <div className="sr-force down">
                    <div className="sr-force-icon">↓</div>
                    <div className="sr-force-title">Force 2: Less needed</div>
                    <div className="sr-force-body">Spending less means your FIRE number — the total corpus required — is <strong>actually smaller.</strong></div>
                  </div>
                </div>

                <table className="sr-table">
                  <thead>
                    <tr>
                      <th>% saved</th>
                      <th>Monthly SIP</th>
                      <th>Monthly spend</th>
                      <th style={{textAlign:"right"}}>Years to FIRE</th>
                    </tr>
                  </thead>
                  <tbody>
                    {res.srRows.map((row, i) => {
                      const isCurrent = i === closestSrIdx;
                      const income = monthlyExpense + monthlyInvest;
                      const invest = income * row.sr / 100;
                      const spend = income * (1 - row.sr / 100);
                      const isBetter = res.actualFireYear && row.years && row.years < res.actualFireYear;
                      return (
                        <tr key={i} className={isCurrent ? "sr-current" : ""}>
                          <td style={{color: isCurrent ? "#F5C842" : isBetter ? "#00D9A0" : "#404058", fontWeight: isCurrent ? 600 : 400}}>
                            {row.sr}%
                            {isCurrent && <span className="sr-fire-badge current">you are here</span>}
                          </td>
                          <td style={{color: isCurrent ? "#EDE9E3" : "#5A5A70"}}>{fmt(invest)}/mo</td>
                          <td style={{color: isCurrent ? "#EDE9E3" : "#363650"}}>{fmt(spend)}/mo</td>
                          <td style={{textAlign:"right", color: isCurrent ? "#F5C842" : isBetter ? "#00D9A0" : "#363650", fontWeight: isCurrent || isBetter ? 500 : 400}}>
                            {row.years ? `${row.years} yrs` : "50+ yrs"}
                            {isBetter && !isCurrent && <span className="sr-fire-badge faster">sooner</span>}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>

                {/* Concrete next-step insight */}
                {(() => {
                  const income = monthlyExpense + monthlyInvest;
                  const nextRow = res.srRows[closestSrIdx + 1];
                  if (!nextRow || !res.srRows[closestSrIdx]) return null;
                  const currentRow = res.srRows[closestSrIdx];
                  const extraInvest = fmt(income * (nextRow.sr - currentRow.sr) / 100);
                  const yearsDiff = currentRow.years && nextRow.years ? currentRow.years - nextRow.years : null;
                  if (!yearsDiff || yearsDiff <= 0) return null;
                  return (
                    <div className="sr-nextstep">
                      Move from <strong>{currentRow.sr}% → {nextRow.sr}%</strong>: invest just <em>{extraInvest}/mo more</em>, spend that much less — and FIRE arrives <em>{yearsDiff} year{yearsDiff > 1 ? "s" : ""} earlier</em>. Both forces working together.
                    </div>
                  );
                })()}
              </div>

              {/* CTA */}
              <div className="cta-end">
                <div className="cta-title">The number is the map.<br />The SIP is the vehicle.</div>
                <div className="cta-sub">Consistency beats strategy, every time. The machine doesn't care about motivation.</div>
                <div className="div-line" />
                <div className="tool-links">
                  <a href="/compounding-machine" className="tool-link gold">Compounding Machine →</a>
                  <a href="/delay-engine" className="tool-link ghost">Delay Cost Engine</a>
                  <a href="/" className="tool-link ghost">All Tools</a>
                </div>
                <div className="div-line" style={{marginTop:28}} />
                <a href="https://calendly.com/vidhaanjain/investmentfirst" target="_blank" rel="noopener noreferrer"
                  style={{display:"block",background:"rgba(245,200,66,0.05)",border:"1px solid rgba(245,200,66,0.22)",borderRadius:14,padding:"22px 24px",textDecoration:"none",marginTop:16,textAlign:"left"}}>
                  <div style={{fontSize:10,letterSpacing:"0.14em",textTransform:"uppercase",color:"#F5C842",fontWeight:600,marginBottom:8,fontFamily:"DM Sans,sans-serif"}}>1:1 Consultation · ₹999 · 45 min</div>
                  <div style={{fontFamily:"DM Serif Display,serif",fontSize:"clamp(18px,2.5vw,22px)",color:"#EDE9E3",marginBottom:6,lineHeight:1.3}}>Build your actual FIRE plan with Vidhaan →</div>
                  <div style={{fontSize:13,color:"#5A5A70",lineHeight:1.7,fontFamily:"DM Sans,sans-serif"}}>We reverse-engineer the number together — income, EMIs, tax, real expenses — and build a plan you'll actually execute.</div>
                </a>
                <a href="https://wisermoney.vercel.app" target="_blank" rel="noopener noreferrer"
                  style={{display:"block",background:"transparent",border:"1px solid #1A1A28",borderRadius:14,padding:"18px 24px",textDecoration:"none",marginTop:10,textAlign:"left"}}>
                  <div style={{fontSize:10,letterSpacing:"0.14em",textTransform:"uppercase",color:"#00D9A0",fontWeight:600,marginBottom:6,fontFamily:"DM Sans,sans-serif"}}>Full Assessment · wisermoney.vercel.app ↗</div>
                  <div style={{fontSize:13,color:"#5A5A70",lineHeight:1.65,fontFamily:"DM Sans,sans-serif"}}>Income, expenses, insurance, EMIs — a complete financial health check across 8 investor archetypes.</div>
                </a>
              </div>

              <div className="footer-line">WISER WITH VIDHAAN · ILLUSTRATIVE CALCULATIONS · NOT PERSONALISED FINANCIAL ADVICE</div>
            </div>
          )}
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
